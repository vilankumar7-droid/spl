server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: event-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:eventservice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    table: event_service_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:event-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

platform:
  outbox:
    destination: ${FEATURE_KAFKA:false}
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:student-loan-platform}
  kafka:
    topics: ${KAFKA_TOPICS:loan-application-events,loan-status-events}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
