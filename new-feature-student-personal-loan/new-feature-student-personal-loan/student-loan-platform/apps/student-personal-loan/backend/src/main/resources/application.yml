server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: student-personal-loan
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personal_loan}
    username: ${DB_USERNAME:studentloan}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null

platform:
  jwt:
    # Must be supplied via the JWT_SECRET environment variable (min 32 chars). Never commit a real value.
    secret: ${JWT_SECRET}
    issuer: student-loan-platform
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    documents-dir: ${DOCUMENT_STORAGE_DIR:./data/documents}
    max-document-bytes: 5242880
  seed:
    demo-users: ${SEED_DEMO_USERS:true}
    demo-password: ${DEMO_USER_PASSWORD:Password@123}
  outbox:
    publish-interval-ms: ${OUTBOX_PUBLISH_INTERVAL_MS:5000}
  # Feature toggles are enforced server-side. The UI only reads them via GET /api/v1/features.
  features:
    personal-loan: ${FEATURE_PERSONAL_LOAN:true}
    jwt-authentication: true
    home-loan: ${FEATURE_HOME_LOAN:false}
    pdf-processing-agent: ${FEATURE_PDF_AGENT:false}
    kafka-event-tracking: ${FEATURE_KAFKA:false}
    background-verification: ${FEATURE_BACKGROUND_VERIFICATION:false}
    elastic-stack: ${FEATURE_ELASTIC:false}
    splunk-integration: ${FEATURE_SPLUNK:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
