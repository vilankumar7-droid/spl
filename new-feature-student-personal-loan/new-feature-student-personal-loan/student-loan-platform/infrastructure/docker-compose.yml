# Local development stack. Usage (from repo root):
#   cp .env.example .env && docker compose --env-file .env -f infrastructure/docker-compose.yml up --build
name: student-loan-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-personal_loan}
      POSTGRES_USER: ${POSTGRES_USER:-studentloan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12

  document-processor:
    build: ../apps/services/document-processor
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 5

  event-service:
    build: ../apps/services/event-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      personal-loan-api:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-personal_loan}
      DB_USERNAME: ${POSTGRES_USER:-studentloan}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPICS: loan-application-events,loan-status-events
      FEATURE_KAFKA: ${FEATURE_KAFKA:-true}
    ports:
      - "8081:8081"

  personal-loan-api:
    build: ../apps/services/student-personal-loan-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      document-processor:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-personal_loan}
      DB_USERNAME: ${POSTGRES_USER:-studentloan}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-60}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-true}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Password@123}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      DOCUMENT_STORAGE_DIR: /data/documents
      DOCUMENT_VERIFICATION_URL: ${DOCUMENT_VERIFICATION_URL:-http://document-processor:8000/verify}
      SPRING_PROFILES_ACTIVE: json-logs
      FEATURE_HOME_LOAN: ${FEATURE_HOME_LOAN:-false}
      FEATURE_PDF_AGENT: ${FEATURE_PDF_AGENT:-true}
      FEATURE_KAFKA: ${FEATURE_KAFKA:-true}
      FEATURE_BACKGROUND_VERIFICATION: ${FEATURE_BACKGROUND_VERIFICATION:-false}
    ports:
      - "8080:8080"
    volumes:
      - document-data:/data/documents

  personal-loan-web:
    build: ../apps/ui/loan-process-ui
    depends_on:
      personal-loan-api:
        condition: service_started
      event-service:
        condition: service_healthy
    ports:
      - "4200:80"

volumes:
  postgres-data:
  document-data:
